name: Daily Supabase Database Health

on:
  schedule:
    # 01:17 UTC = 09:17 Asia/Taipei; avoid the busy start of the hour.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-health
  cancel-in-progress: false

jobs:
  database-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public catalog through the database API
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Configure EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL must be an HTTPS Supabase project URL."
            exit 1
          fi

          # Real, bounded database reads; an empty catalog is also healthy.
          # apikey supports both legacy anon keys and public publishable keys.
          for check in 1 2 3; do
            response=$(curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 20 \
              --retry 2 --retry-delay 2 --retry-max-time 60 --retry-connrefused \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header 'Accept: application/json' \
              "${SUPABASE_URL%/}/rest/v1/item_catalog?select=id&limit=1")
            if ! jq -e 'type == "array" and length <= 1' <<< "$response" > /dev/null; then
              echo "::error::Database API returned an unexpected response."
              exit 1
            fi
            echo "Database read ${check}/3 passed."
          done
          echo '### Supabase database health: passed (3 read-only catalog queries)' >> "$GITHUB_STEP_SUMMARY"
